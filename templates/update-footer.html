<a id="footer-update" href="/config#updates" hidden style="color:#b42332;font-weight:700;margin-left:10px">Update available</a>
<dialog id="release-update-dialog" aria-labelledby="release-update-title" style="width:min(680px,calc(100vw - 32px));max-height:85vh;border:1px solid #d8d3e0;border-radius:16px;padding:24px;color:#272332;background:white;text-align:left">
<h2 id="release-update-title">An update is available</h2>
<p id="release-update-summary"></p><div id="release-update-changes" style="max-height:50vh;overflow:auto"></div>
<p id="release-update-route"></p><div style="display:flex;flex-wrap:wrap;gap:12px"><a href="/config#updates" id="release-update-action">Update instructions</a><button type="button" class="secondary" id="release-update-later">Remind me tomorrow</button><button type="button" class="secondary" id="release-update-close">Close</button></div>
</dialog>
<script>
(()=>{
const link=document.getElementById('footer-update');let checking=false,lastAttempt=0;
const dialog=document.getElementById('release-update-dialog');let latestState=null;
function key(s){return 'release-update-notice:'+s.repository+':'+s.current}
function remember(s,delay=0){try{localStorage.setItem(key(s),JSON.stringify({version:s.latest,remind:delay?Date.now()+delay:0}))}catch{}}
function show(s,manual=false){
 if(!s.available||!s.latest||s.working||s.reserved||dialog.open)return;
 if(!manual){let seen={};try{seen=JSON.parse(localStorage.getItem(key(s))||'{}')}catch{}if(seen.version===s.latest&&(!seen.remind||seen.remind>Date.now()))return;if(document.querySelector('dialog[open]'))return;}
 document.getElementById('release-update-title').textContent='Version '+s.latest+' is available';
 document.getElementById('release-update-summary').textContent='Changes since your installed version '+s.current+'. Updating is optional.';
 const notes=document.getElementById('release-update-changes');notes.replaceChildren();
 for(const change of s.changes||[]){const section=document.createElement('section'),title=document.createElement('h3'),body=document.createElement('div');title.textContent='Version '+change.version;body.textContent=change.body;body.style.whiteSpace='pre-wrap';body.style.overflowWrap='anywhere';section.append(title,body);notes.append(section)}
 if(!notes.childNodes.length)notes.textContent='Release notes are not available. See the release history before updating.';
 document.getElementById('release-update-route').textContent=s.platform==='docker'?'Run Update-Linux.sh or Update-macOS.command in your Docker package folder. Docker remains controlled from your computer; accounts and files are preserved.':s.platform==='windows'?'Install the update from Configuration when you are ready.':'This is a development installation. Update the checkout deliberately; do not replace it with a packaged release.';
 latestState=s;remember(s);dialog.showModal();
}
document.getElementById('release-update-close').onclick=()=>dialog.close();
document.getElementById('release-update-later').onclick=()=>{remember(latestState,86400000);dialog.close()};
document.getElementById('release-update-action').onclick=()=>dialog.close();
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
link.addEventListener('click',e=>{if(latestState?.available){e.preventDefault();show(latestState,true)}});
async function refresh(){if(checking||document.hidden)return;checking=true;try{const response=await fetch('/api/updates',{cache:'no-store'});if(!response.ok)return;const state=await response.json();latestState=state;link.hidden=!state.available;link.title=state.available?state.message:'';show(state);const now=Date.now()/1000;if(!state.working&&!state.reserved&&now-Math.max(state.last_checked||0,lastAttempt)>86400){lastAttempt=now;await fetch('/api/updates/check',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}}catch(e){}finally{checking=false}}
refresh();setInterval(refresh,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
})();
</script>
